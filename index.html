<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 우리 반 모둠 나누기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="main-header">
      <div class="header-left">
        <span class="logo-icon">🎲</span>
        <div>
          <h1>우리 반 모둠 나누기</h1>
          <p class="subtitle">출석번호로 쉽고 공정하게 모둠을 구성하세요</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnSoundToggle" class="icon-btn" title="효과음 켜기/끄기">
          <span id="soundIcon">🔊</span> 효과음
        </button>
        <button id="btnFullscreen" class="icon-btn" title="전체화면 (스마트보드/TV용)">
          <span>⛶</span> 전체화면
        </button>
      </div>
    </header>

    <!-- 설정 및 컨트롤 패널 -->
    <section class="control-panel card" id="controlPanel">
      <div class="panel-section-title">
        <h2>⚙️ 모둠 설정</h2>
        <button id="btnToggleSettings" class="text-btn">접기 ▲</button>
      </div>

      <div class="settings-grid" id="settingsBody">
        <!-- 1. 총 학생 수 설정 -->
        <div class="setting-item">
          <label for="totalStudentsInput">
            <span class="step-badge">1</span> 총 학생 수 (출석번호 끝번호)
          </label>
          <div class="number-stepper">
            <button type="button" class="step-btn" id="btnDecStudent">-</button>
            <input type="number" id="totalStudentsInput" min="2" max="60" value="25">
            <button type="button" class="step-btn" id="btnIncStudent">+</button>
            <span class="unit">명</span>
          </div>
        </div>

        <!-- 2. 모둠당 인원수 -->
        <div class="setting-item">
          <label for="groupSizeInput">
            <span class="step-badge">2</span> 모둠당 목표 인원수
          </label>
          <div class="number-stepper">
            <button type="button" class="step-btn" id="btnDecGroupSize">-</button>
            <input type="number" id="groupSizeInput" min="2" max="15" value="4">
            <button type="button" class="step-btn" id="btnIncGroupSize">+</button>
            <span class="unit">명씩</span>
          </div>
        </div>

        <!-- 3. 남는 인원 처리 방식 -->
        <div class="setting-item full-width">
          <label>
            <span class="step-badge">3</span> 인원이 딱 떨어지지 않을 때 (남는 학생 처리)
          </label>
          <div class="radio-options">
            <label class="radio-card">
              <input type="radio" name="remainderPolicy" value="distribute" checked>
              <div class="radio-content">
                <strong>골고루 분배하기 (추천)</strong>
                <p>기존 모둠들에 1명씩 추가 (예: 25명 / 4명씩 → 5명 모둠 1개, 4명 모둠 5개)</p>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="remainderPolicy" value="extra_group">
              <div class="radio-content">
                <strong>별도 모둠 생성하기</strong>
                <p>남는 인원만으로 작은 모둠 하나 더 만들기 (예: 25명 / 4명씩 → 4명 모둠 6개, 1명 모둠 1개)</p>
              </div>
            </label>
          </div>
        </div>

        <!-- 4. 모둠장 및 역할 설정 -->
        <div class="setting-item full-width">
          <label>
            <span class="step-badge">4</span> 모둠장 및 역할 뽑기
          </label>
          <div class="checkbox-row">
            <label class="custom-checkbox">
              <input type="checkbox" id="chkAssignLeader" checked>
              <span>모둠원 중 1명을 <strong>모둠장(👑)</strong>으로 자동 선정</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" id="chkAssignRoles">
              <span>수업 역할 자동 분담 (이끄미, 기록이, 지킴이, 발표이)</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" id="chkRevealAnimation" checked>
              <span>두구두구 추첨 애니메이션 효과</span>
            </label>
          </div>
        </div>

        <!-- 5. 결석자 선택 영역 -->
        <div class="setting-item full-width">
          <div class="absent-header">
            <label>
              <span class="step-badge">5</span> 결석자 제외 (해당 번호를 클릭하세요)
            </label>
            <div class="absent-stats">
              현재 참여 학생: <span id="activeCount" class="highlight-num">25</span>명
              <span id="absentSummary" class="absent-tag-info">(결석 0명)</span>
              <button type="button" id="btnResetAbsent" class="small-btn">전원 출석</button>
            </div>
          </div>
          <div class="student-number-grid" id="studentNumberGrid">
            <!-- 번호 칩이 동적으로 생성됨 -->
          </div>
        </div>
      </div>

      <!-- 모둠 생성 실행 버튼 -->
      <div class="action-bar">
        <button id="btnCreateGroups" class="primary-btn">
          <span class="btn-icon">🚀</span>
          <span class="btn-text">모둠 나누기 시작!</span>
        </button>
      </div>
    </section>

    <!-- 추첨 연출 오버레이/프로그레스 -->
    <div id="drawOverlay" class="draw-overlay hidden">
      <div class="draw-box">
        <div class="draw-spinner">🎲</div>
        <div class="draw-title" id="drawTitle">공정하게 섞는 중...</div>
        <div class="draw-subtitle" id="drawSubtitle">잠시만 기다려주세요!</div>
      </div>
    </div>

    <!-- 결과 영역 -->
    <section class="result-section" id="resultSection">
      <div class="result-header">
        <div class="result-title-group">
          <h2>🎉 모둠 편성 결과</h2>
          <span id="resultMeta" class="result-meta">총 0개 모둠</span>
        </div>
        <div class="result-actions">
          <button id="btnReshuffle" class="secondary-btn">
            🔄 다시 섞기
          </button>
          <button id="btnRerollLeaders" class="secondary-btn" title="모둠원은 그대로 두고 모둠장만 다시 뽑습니다">
            👑 모둠장 다시 뽑기
          </button>
          <button id="btnCopyText" class="secondary-btn">
            📋 텍스트 복사
          </button>
          <button id="btnPrint" class="secondary-btn">
            🖨️ 인쇄 / PDF 저장
          </button>
        </div>
      </div>

      <div class="result-hint">
        💡 <strong>팁:</strong> 학생 번호를 마우스로 끌어서(드래그 앤 드롭) 다른 모둠으로 자유롭게 바꿀 수 있습니다.
      </div>

      <!-- 모둠 카드들이 배치되는 그리드 -->
      <div class="groups-grid" id="groupsGrid">
        <div class="empty-state">
          위의 <strong>[모둠 나누기 시작!]</strong> 버튼을 눌러 모둠을 편성해보세요.
        </div>
      </div>
    </section>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script src="app.js"></script>
</body>
</html>
